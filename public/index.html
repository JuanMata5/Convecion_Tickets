<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear Ticket - Manchas Plein Air</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #fef9f0, #fcd34d);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 360px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #e53935;
      font-weight: 700;
    }

    input, select {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ffcd38, #ff6f61);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, #ffb700, #ff4a3a);
    }

    .btn-admin {
      margin-top: 10px;
      background: #4a90e2;
    }

    .btn-admin:hover {
      background: #357ab8;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Crear tu Ticket</h2>

  <input id="nombre" placeholder="Nombre y Apellido">
  <input id="email" placeholder="Email">
  <input id="evento" placeholder="Evento">

  <select id="categoria">
    <option value="basico">Básico</option>
    <option value="vip">VIP</option>
    <option value="premium">Premium</option>
  </select>

  <button id="crearTicketBtn">Crear Ticket</button>
  <button id="btnAdmin" class="btn-admin">Panel Admin</button>
</div>

<script>
async function crearTicket() {
  const nombre = document.getElementById("nombre").value.trim();
  const email = document.getElementById("email").value.trim();
  const evento = document.getElementById("evento").value.trim();
  const categoria = document.getElementById("categoria").value;

  if (!nombre || !email || !evento) {
    alert("Por favor completa todos los campos.");
    return;
  }

  try {
    const res = await fetch("/api/tickets", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nombre, email, evento, categoria })
    });

    const data = await res.json().catch(() => null);

    if (!res.ok) {
      // Si ya existe ticket, redirige al existente
      if (data?.ticket) {
        alert("Ya tienes un ticket para este evento. Se abrirá tu ticket existente.");
        window.location.href = `/ticket.html?codigo=${data.ticket.codigo}`;
      } else {
        alert(data?.error || "Error creando ticket");
      }
      return;
    }

    console.log("Ticket creado:", data);
    alert(`¡Ticket creado! Revisa tu correo: ${email}`);
    window.location.href = `/ticket.html?codigo=${data.codigo}`;

  } catch (err) {
    console.error("Error conectando con la API:", err);
    alert("Error conectando con el servidor");
  }
}

// Botón Crear Ticket
document.getElementById("crearTicketBtn").addEventListener("click", crearTicket);

const ADMIN_PASSWORD = "chubaca"; // la contraseña que quieras

document.getElementById("btnAdmin").addEventListener("click", () => {
  const key = prompt("Ingresa la contraseña de admin:");

  if (key === ADMIN_PASSWORD) {
    // contraseña correcta → redirigimos sin llamar al backend
    window.location.href = "/admin.html";
  } else {
    alert("Contraseña incorrecta 😅");
  }
});
</script>

</body>
</html>
