<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
    button { padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-eliminar { background: #e53935; color: #fff; }
    .btn-eliminar:hover { background: #c62828; }
  </style>
</head>
<body>
  <h2>Panel Admin - Tickets</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Código</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Evento</th>
        <th>Categoría</th>
        <th>Usado</th>
        <th>Creado En</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaTickets"></tbody>
  </table>

  <script>
    async function cargarTickets() {
      try {
        const res = await fetch("/api/listar");
        const tickets = await res.json();

        const tbody = document.getElementById("tablaTickets");
        tbody.innerHTML = "";

        tickets.forEach(t => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${t.id}</td>
            <td>${t.codigo}</td>
            <td>${t.nombre}</td>
            <td>${t.email}</td>
            <td>${t.evento}</td>
            <td>${t.categoria}</td>
            <td>${t.usado ? "Sí" : "No"}</td>
            <td>${new Date(t.creadoEn).toLocaleString()}</td>
            <td><button class="btn-eliminar" data-codigo="${t.codigo}">Eliminar</button></td>
          `;
          tbody.appendChild(tr);
        });

        // Botones eliminar
        document.querySelectorAll(".btn-eliminar").forEach(btn => {
          btn.addEventListener("click", async () => {
            const codigo = btn.getAttribute("data-codigo");
            if (!confirm(`¿Seguro querés eliminar el ticket ${codigo}?`)) return;

            try {
              const res = await fetch(`/api/delete?codigo=${codigo}`, {
                method: "DELETE"
              });

              if (!res.ok) {
                const error = await res.json();
                return alert(error.error || "No se pudo eliminar el ticket");
              }

              alert(`Ticket ${codigo} eliminado`);
              cargarTickets();
            } catch (err) {
              console.error(err);
              alert("Error conectando con el servidor");
            }
          });
        });

      } catch (err) {
        console.error(err);
        alert("Error conectando con el servidor");
      }
    }

    cargarTickets();
  </script>
</body>
</html>
